<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unlock i2nclip</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Unlock</h1>
    <p>The passphrase is not saved. It lasts until you quit Firefox.</p>
    <form id="form">
      <label for="pass">Passphrase</label>
      <input id="pass" type="password" autocomplete="current-password" autofocus />
      <button type="submit">Unlock</button>
    </form>
    <p id="status"></p>
    <script type="module" src="unlock.js"></script>
  </body>
</html>
