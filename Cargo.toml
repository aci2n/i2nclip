[package]
name = "i2nclip"
version = "0.1.0"
edition = "2021"
publish = false
description = "Encrypted media store. The server keeps ciphertext and public keys."

[dependencies]
# HTTP framework. Handlers look a bit like small servlet methods.
axum = "0.8"
# Base64 for ciphertext and base64url for public keys, bearer tokens, and tags.
base64 = "0.22"
# Ed25519 request signatures.
ed25519-dalek = "2"
# Operating-system random bytes for nonces and new keys.
getrandom = "0.2"
# Helpers for reading an HTTP body with a size cap.
http-body-util = "0.1"
# Stream bounded file chunks into HTTP response bodies.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Optional tooling for the explicit database test target only.
testcontainers = { version = "0.28", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Implements Rust's Error trait the way a base exception type would.
thiserror = "2"
# Async runtime. `#[tokio::main]` is the event loop, like asyncio.run.
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# WHATWG URL parsing and origin serialization, matching browser request signatures.
url = "2"

[dev-dependencies]
# Reference-client encryption, key derivation, and searchable tag tokens.
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
unicode-normalization = "0.1"
# Controlled request streams and paused-clock deadline tests.
http-body-util = { version = "0.1", features = ["channel"] }
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
# Lets tests call the router in-process, without binding a port.
tower = { version = "0.5", features = ["util"] }
# Test-only, thread-local heap allocation measurements for frame decoding.
allocation-counter = "0.8.1"

[features]
postgres-tests = []
test-containers = ["dep:testcontainers"]

[[test]]
name = "postgres_api"
path = "tests/postgres_api.rs"
required-features = ["postgres-tests"]

[[example]]
name = "postgres-tests"
required-features = ["test-containers"]
